<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Contact information for Lea Jordan, PhD Candidate in Sociology at the University of Zurich." />

  <link rel="stylesheet" href="styles.css" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      color: #222;
      background-color: #ffffff;
    }

    a {
      color: #4a8f6a;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    main.container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .office {
      margin-bottom: 1rem;
      line-height: 1.7;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 2rem;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: #4b5563;
      text-decoration: none;
      font-weight: 400;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .contact-button:hover {
      color: #4a8f6a;
      border-color: #4a8f6a;
      text-decoration: none;
    }

</head>

  <p class="office">
    <strong>Office:</strong><br>
    Department of Sociology, University of Zurich<br>
